[workspace]
resolver = "3"
members = [
    "crates/cato-core",
    "crates/cato-backend-llvm",
    "crates/cato-cli",
    "crates/cato-backend-interp",
    "crates/cato-fmt",
    "crates/cato-assets",
    "crates/cato-lld-sys",
]

[workspace.package]
version = "0.1.1"
edition = "2024"

[profile.release]
opt-level = 3
